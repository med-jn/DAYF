name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (fixed signature)
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors (appears in the run Summary page)
        if: failure()
        run: |
          {
            echo '## أخطاء البناء'
            echo '```'
            grep -E '^e: |What went wrong|error:' -A2 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TikGuest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TikGuest-apk
          path: TikGuest.apk
      - name: Publish release (download straight from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tik Guest ${{ github.run_number }}
          files: TikGuest.apk
