name: Build APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare
        run: chmod +x gradlew
      - name: Optional upload key (only if the secrets exist)
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK (sideload, fixed signature) and AAB (Google Play)
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug bundleRelease --console=plain 2>&1 | tee build.log
      - name: Show errors (appears in the run Summary page)
        if: failure()
        run: |
          {
            echo '## أخطاء البناء'
            echo '```'
            grep -E '^e: |What went wrong|error:' -A2 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect
        run: |
          mkdir -p dist
          CODE=$(grep '^versionCode=' version.properties | cut -d= -f2)
          cp app/build/outputs/apk/debug/app-debug.apk "dist/TikGuest-1.0.$CODE.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/TikGuest-1.0.$CODE.aab"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: TikGuest-1.0.${{ env.CODE }}
          path: dist/*
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.CODE }}-b${{ github.run_number }}
          name: Tik Guest 1.0.${{ env.CODE }} (build ${{ github.run_number }})
          files: dist/*
